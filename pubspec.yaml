name: crewx_partner
description: CrewX Partners — Organiser app for event staffing
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_app_check: ^0.3.1+4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  pinput: ^5.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
